<!DOCTYPE html>
<html lang="da">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chango&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loge Langoustine</title>

    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="apple-touch-icon" href="images/logo.png">

    <style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

#container{
    display:flex;
    min-height:100vh;
}

    
#sidebar{
    width:350px;
    background:#1a1a1a;
    padding:20px;
    overflow-y:auto;
    border-right:1px solid #333;
}

#content{
    flex:1;
    padding:40px;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.country-name{
    font-family:'Cinzel', serif;
    letter-spacing:1px;
}
    
.logo img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:50%;
    transition:0.2s ease;
}

.logo img:hover{
    transform:scale(1.03);
    opacity:0.9;
}

.language-switch{
    text-align:center;
    margin-bottom:20px;
}

.language-switch button{
    background:#222;
    color:white;
    border:1px solid #444;
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
    margin:2px;
}

.language-switch button:hover{
    background:#333;
}

.toggle{
    width:100%;
    background:none;
    border:none;
    color:white;
    text-align:left;
    font-size:18px;
    cursor:pointer;
    padding:8px 0;
}

.city{
    margin-left:40px;
    padding:2px 0;
    font-size:15px;
    color:#cfcfcf;
}

.restaurant{
    margin-left:40px;
    color:#7cc8ff;
    cursor:pointer;
    padding:5px 0;
}

.restaurant:hover{
    color:white;
}

.hidden{
    display:none;
}

h1{
    margin-top:0;
}

.welcome-title{
    font-family:'Chango', cursive;
    font-size:clamp(42px, 5vw, 56px);
    line-height:1.1;
}
    
.info-card{
    background:#222;
    padding:20px;
    border-radius:12px;
    max-width:800px;
}

.info-card a{
    color:#7cc8ff;
}

.review-heading{
    font-size:16px;
    font-family:'Source Sans Pro', sans-serif;
    font-weight:900;
}

.review-text{
    font-family:'Source Sans Pro', sans-serif;
}

.review-score{
    display:inline-block;
    white-space:nowrap;
}

.review-info{
    position:relative;
    display:inline-block;
    margin-left:6px;
    font-family:Arial,sans-serif;
    font-size:14px;
    font-weight:normal;
    vertical-align:middle;
}

.review-info-button{
    display:inline-flex;
    width:17px;
    height:17px;
    align-items:center;
    justify-content:center;
    padding:0;
    border:1px solid #cfcfcf;
    border-radius:50%;
    background:transparent;
    color:#cfcfcf;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
    line-height:1;
}

.review-info-box{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    z-index:10;
    display:none;
    width:380px;
    max-width:calc(100vw - 48px);
    max-height:70vh;
    overflow-y:auto;
    padding:12px;
    border:1px solid #444;
    border-radius:8px;
    background:#333;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
    color:white;
    font-size:14px;
    font-weight:normal;
    line-height:1.4;
    white-space:normal;
}

.review-info:hover .review-info-box,
.review-info:focus-within .review-info-box{
    display:block;
}

.restaurant-map-popup .review-info-box{
    left:auto;
    right:0;
    width:180px;
    max-width:calc(100vw - 80px);
    max-height:220px;
}

.restaurant-info-popup .leaflet-popup-content{
    overflow-x:hidden;
}

@media(max-width:900px){

    #container{
        flex-direction:column;
    }

    #sidebar{
        width:100%;
    }

    #content{
        padding:20px;
    }
}

    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <div class="logo">
                <a
                    href="https://www.instagram.com/logelangoustine/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <img src="images/logo.png">
                </a>
            </div>

            <div class="language-switch">
                <button onclick="setLanguage('da')">DA</button>
                <button onclick="setLanguage('en')">EN</button>
            </div>

            <div id="menu">
                Indlæser restauranter...
            </div>
        </div>

        <div id="content">
            <h1 class="welcome-title">
                Velkommen til<br>
                Loge Langoustine
            </h1>

            <div class="info-card">
                <p>
                    Velkommen til vores gastronomiske univers.
                </p>

                <p>
                    På denne side samler vi restauranter,
                    og madoplevelser fra Danmark
                    og resten af verden.
                </p>
            </div>
        </div>
    </div>

<script>

let restaurants = [];
let currentLanguage = "da";
let currentPage = {
    type: "home"
};

let previousPage = null;
let previousScrollY = 0;

let mapMode = false;
let mapMarkers = [];
    
    let activeCategories = {
    "Fine Dining": true,
    "Side Dish": true,
    "Value Hunt": true,
};
    
function t(da, en){
    return currentLanguage === "da" ? da : en;
}

function distanceText(value){

    if(value < 1){
        return Math.round(value * 1000) +
            (currentLanguage === "da"
                ? " m væk"
                : " m away");
    }

    return value.toFixed(1) +
        (currentLanguage === "da"
            ? " km væk"
            : " km away");
}


let userLat = null;
let userLng = null;

    navigator.geolocation.getCurrentPosition(

    position => {

        userLat = position.coords.latitude;
        userLng = position.coords.longitude;

        const title =
            document.querySelector("#content h1");

        if(title){

            const pageName =
                title.textContent;

            if(
    [...new Set(restaurants.map(r => r.land))]
    .includes(pageName)
){
    showCountry(pageName);
}

if(
    pageName === "Se hvad der er i nærheden"
){
    showNearbyMap();
}

        }

    },

    error => {

        console.error("Kunne ikke hente din placering:", error);

    }

);


fetch('GithubRestauranter.json')
.then(response => {
    if (!response.ok) {
        throw new Error(`Kunne ikke indlæse restauranter: ${response.status}`);
    }
    return response.json();
})
.then(data => {
    restaurants = data;
    buildMenu();
})
.catch(error => {
    console.error("Kunne ikke indlæse restauranter fra JSON:", error);
});

function buildMenu(){

    const menu = document.getElementById('menu');

    let html = '';

    html += `
<div style="margin-bottom:20px;">

<label>
<input
    type="checkbox"
    ${activeCategories["Fine Dining"] ? "checked" : ""}
    onchange="toggleCategory('Fine Dining')">
Fine Dining
</label>

<br>

<label>
<input
    type="checkbox"
    ${activeCategories["Side Dish"] ? "checked" : ""}
    onchange="toggleCategory('Side Dish')">
Side Dish
</label>

<br>

<label>
<input
    type="checkbox"
    ${activeCategories["Value Hunt"] ? "checked" : ""}
    onchange="toggleCategory('Value Hunt')">
Value Hunt
</label>

<br>

<label>
<input
    type="checkbox"
    ${mapMode ? "checked" : ""}
    onchange="toggleMapMode(this.checked)">
Kortvisning
</label>

</div>
`;

    const lande = [...new Set(
        restaurants.map(r => r.land)
    )].sort((a, b) => a.localeCompare(b, 'da'));

    lande.forEach((land, landIndex) => {

        html += `
<div style="
    display:flex;
    align-items:center;
">

    <span
        style="
            cursor:pointer;
            width:20px;
            display:inline-block;
        "
        onclick="toggleMenu('land${landIndex}', this)">
        ▶
    </span>

    <span
        class="country-name"
        style="
            cursor:pointer;
            padding-left:8px;
            font-size:28px;
        "
        onclick="showCountry('${land}')">
        ${land}
    </span>

</div>

<div id="land${landIndex}" class="hidden">
`;

        const regioner = [...new Set(

            restaurants
            .filter(r =>
                r.land === land &&
                activeCategories[r.kategori]
            )
            .map(r => r.region)

        )].sort((a, b) => a.localeCompare(b, 'da'));

        regioner.forEach((region, regionIndex) => {

            html += `
<div style="
    display:flex;
    align-items:center;
    margin-left:25px;
">

    <span
        style="
            cursor:pointer;
            width:20px;
            display:inline-block;
        "
        onclick="toggleRegion(
            'region${landIndex}${regionIndex}',
            this
        )">

        ▶

    </span>

    <span
        style="
            cursor:pointer;
            color:#bbbbbb;
            font-family:'Cinzel', serif;
            font-size:14px;
            padding-left:5px;
        "
        onclick="showRegion('${region}')">

        ${region}

    </span>

</div>

<div
    id="region${landIndex}${regionIndex}"
    class="hidden">
`;

            const byer = [...new Set(

                restaurants
                .filter(r =>
                    r.land === land &&
                    r.region === region &&
                    activeCategories[r.kategori]
                )
                .map(r => r.by)

            )].sort((a, b) => a.localeCompare(b, 'da'));

            byer.forEach(by => {

                html += `
<button
    class="toggle city"
    onclick="showCity('${by}')">

    ${by}

</button>
`;

            });

        html += `</div>`;
            
        });

        html += `</div>`;

    });

    menu.innerHTML = html;

}

function toggleCategory(category){

    activeCategories[category] =
        !activeCategories[category];

    buildMenu();

    if(currentPage.type === "country"){
        showCountry(currentPage.value);
    }

    if(currentPage.type === "region"){
    showRegion(currentPage.value);

    }
    
    if(currentPage.type === "city"){
        showCity(currentPage.value);
    }

    if(currentPage.type === "nearby"){
        showNearbyMap();
    }

}

function toggleMapMode(value){

    mapMode = value;

    if(mapMode){

        showMap();

    }else{

        setLanguage(currentLanguage);
    }

}

function showMap(){

    document.getElementById("content").innerHTML = `
        <div id="map"
             style="
                width:100%;
                height:85vh;
                border-radius:12px;
             ">
        </div>
    `;

    const map = L.map('map')
        .setView([56, 11], 6);

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution:'© OpenStreetMap'
        }
    ).addTo(map);

    window.mainMap = map;
    mapMarkers = [];
    setMapMarkers(
        restaurants.filter(r => activeCategories[r.kategori])
    );

}

function zoomToCountry(country){

    const countryRestaurants =
        restaurants.filter(r =>
            r.land === country &&
            activeCategories[r.kategori]
        );

    zoomToRestaurants(countryRestaurants);

}

function setMapMarkers(restaurantList){

    if(!window.mainMap) return [];

    mapMarkers.forEach(marker => marker.remove());
    mapMarkers = [];

    const locations = [];

    restaurantList.forEach(r => {
        if(!r.gps) return;

        const [lat, lng] = r.gps.split(',').map(Number);
        if(!Number.isFinite(lat) || !Number.isFinite(lng)) return;

        locations.push([lat, lng]);
        const marker = L.marker([lat, lng]).addTo(window.mainMap);
        bindRestaurantPopup(marker, r);
        mapMarkers.push(marker);
    });

    return locations;
}
    
function zoomToRestaurant(name){

    const r =
        restaurants.find(x =>
            x.restaurant === name
        );

    if(!r || !r.gps) return;

    const locations = setMapMarkers([r]);
    if(locations.length === 0) return;

    window.mainMap.setView(
        locations[0],
        16
    );

}

function zoomToRestaurants(restaurantList){

    if(!window.mainMap) return;

    const locations = setMapMarkers(restaurantList);

    if(locations.length === 0) return;

    if(locations.length === 1){
        window.mainMap.flyTo(
            locations[0],
            16,
            {duration:1.2}
        );
        return;
    }

    window.mainMap.flyToBounds(
        L.latLngBounds(locations),
        {
            padding:[50,50],
            maxZoom:16,
            duration:1.2
        }
    );
}


function toggleMenu(id, btn){

    document.querySelectorAll('#menu > div[id^="land"]').forEach(section => {
        if(section.id !== id){
            section.style.display = "none";
            section.previousElementSibling
                .querySelector('span[onclick^="toggleMenu"]')
                .innerHTML = "▶";
        }
    });

    const element =
        document.getElementById(id);

    if(element.style.display === "block"){

        element.style.display = "none";
        btn.innerHTML = "▶";

    }else{

        element.style.display = "block";
        btn.innerHTML = "▼";

    }

}

function toggleRegion(id, btn){

    const countrySection = btn.parentElement.parentElement;

    Array.from(countrySection.children).forEach(section => {
        if(section.id.startsWith("region") && section.id !== id){
            section.style.display = "none";
            section.previousElementSibling
                .querySelector('span[onclick^="toggleRegion"]')
                .innerHTML = "▶";
        }
    });

    const element =
        document.getElementById(id);

    if(element.style.display === "block"){

        element.style.display = "none";
        btn.innerHTML = "▶";

    }else{

        element.style.display = "block";
        btn.innerHTML = "▼";

    }

}

function setLanguage(lang){

    currentLanguage = lang;

    document.getElementById('content').innerHTML = `
        <h1 class="welcome-title">
            ${t("Velkommen til", "Welcome to")}<br>
            Loge Langoustine
        </h1>

        <div class="info-card">
            <p>${t(
                "Velkommen til vores gastronomiske univers.",
                "Welcome to our gastronomic universe."
            )}</p>

            <p>${t(
                "På denne side samler vi restauranter, vinbarer og madoplevelser fra Danmark og resten af verden.",
                "Here we collect restaurants, wine bars and dining experiences from Denmark and around the world."
            )}</p>
        </div>
    `;

    buildMenu();

    if(currentPage.type === "country"){
        showCountry(currentPage.value);
        return;
    }

    if(currentPage.type === "region"){
        showRegion(currentPage.value);
        return;
    }

    if(currentPage.type === "city"){
        showCity(currentPage.value);
        return;
    }

    if(currentPage.type === "restaurant"){
        showRestaurant(currentPage.value);
        return;
    }

    if(currentPage.type === "nearby"){
        showNearbyMap();
        return;
    }

}



function getDistance(gps){

    if(!gps || !userLat || !userLng)
        return "";

    return distanceText(distanceInKm(gps));
}

function getDistanceValue(gps){

    if(!gps || !userLat || !userLng)
        return 999999;

    return distanceInKm(gps);
}

function distanceInKm(gps){

    const coords = gps.split(",");

    const lat = parseFloat(coords[0]);
    const lng = parseFloat(coords[1]);

    const dLat =
        (lat - userLat) * Math.PI / 180;

    const dLng =
        (lng - userLng) * Math.PI / 180;

    const latitudeRadians = userLat * Math.PI / 180;
    const destinationLatitudeRadians = lat * Math.PI / 180;

    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2) +

        Math.cos(latitudeRadians) *
        Math.cos(destinationLatitudeRadians) *

        Math.sin(dLng/2) *
        Math.sin(dLng/2);

    const c =
        2 * Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

    return 6371 * c;
}
    
function showCountry(country){

    currentPage = {
        type: "country",
        value: country
    };

if(mapMode){

    zoomToCountry(country);
    return;

}
    
    const countryRestaurants =
    restaurants.filter(r =>

        r.land === country &&
        activeCategories[r.kategori]

    );


   let html = `
    <h1>${country}</h1>
    <br>
`;

    countryRestaurants
.sort((a, b) => {

    const distA =
        getDistanceValue(a.gps);

    const distB =
        getDistanceValue(b.gps);

    return distA - distB;

})
.forEach(r => {

        const distance = getDistance(r.gps);

        html += `

        <div class="info-card"
             style="
                margin-bottom:20px;
                cursor:pointer;
             "
             onclick="showRestaurant('${r.restaurant}')">

           <h2>${r.restaurant}</h2>

${distance ? `
<p style="
    color:#bbbbbb;
    margin-top:5px;
    margin-bottom:15px;
">
📍 ${distance}
</p>
` : ''}

${r.billede ? `
<img
    src="${r.billede}"
    style="
        width:100%;
        max-height:250px;
        object-fit:cover;
        border-radius:12px;
        margin-bottom:15px;
    ">
` : ''}
        </div>

        `;

    });

    document.getElementById('content').innerHTML = html;
}
    
    function showCity(city){

    currentPage = {
        type: "city",
        value: city
    };

    const cityRestaurants =
    restaurants.filter(r =>

        r.by === city &&
        activeCategories[r.kategori]

    );

    if(mapMode){
        zoomToRestaurants(cityRestaurants);
        return;
    }

    let html = `
    <h1>${city}</h1>
    <br>
`;

    cityRestaurants
.sort((a, b) =>
    getDistanceValue(a.gps) -
    getDistanceValue(b.gps))
.forEach(r => {

        const distance = getDistance(r.gps);

        html += `

        <div class="info-card"
             style="
                margin-bottom:20px;
                cursor:pointer;
             "
             onclick="showRestaurant('${r.restaurant}')">

            <h2>${r.restaurant}</h2>

${distance ? `
<p style="
    color:#bbbbbb;
    margin-top:5px;
    margin-bottom:15px;
">
📍 ${distance}
</p>
` : ''}

${r.billede ? `
<img
    src="${r.billede}"
    style="
        width:100%;
        max-height:250px;
        object-fit:cover;
        border-radius:12px;
        margin-bottom:15px;
    ">
` : ''}

        </div>

        `;
    });

    document.getElementById('content').innerHTML = html;
}

function showRegion(region){

    currentPage = {
    type: "region",
    value: region
};
    
    const regionRestaurants =
        restaurants.filter(r =>

            r.region === region &&
            activeCategories[r.kategori]

        ).sort((a, b) =>
            getDistanceValue(a.gps) -
            getDistanceValue(b.gps)
        );

    if(mapMode){
        zoomToRestaurants(regionRestaurants);
        return;
    }

    let html = `
    <h1>${region}</h1>
    <br>
    `;

    regionRestaurants.forEach(r => {

        html += `
        <div class="info-card"
             style="
                margin-bottom:20px;
                cursor:pointer;
             "
             onclick="showRestaurant('${r.restaurant}')">

            <h2>${r.restaurant}</h2>

            ${r.billede ? `
            <img
                src="${r.billede}"
                style="
                    width:100%;
                    max-height:250px;
                    object-fit:cover;
                    border-radius:12px;
                ">
            ` : ''}

        </div>
        `;

    });

    document.getElementById('content').innerHTML =
        html;

}
    
function restaurantDetailsHtml(r, isPopup = false){

    const addressLabel =
        currentLanguage === "da"
        ? "Adresse:"
        : "Address:";

    const distance = getDistance(r.gps);

    const reviewLabel =
        currentLanguage === "da"
        ? "💬 Anmeldelse"
        : "💬 Review";

    const reviewText =
        currentLanguage === "da"
        ? (r.anmeldelse || "Ingen anmeldelse endnu")
        : (r.anmeldelse || "No review yet");

    const reviewHtml = reviewText
        .replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[character]))
        .replace(/(^|\n)(Samlet karakter:\s*\d+(?:[.,]\d+)?)/g, (match, lineBreak, heading) =>
            `${lineBreak}<span class="review-score"><strong class="review-heading">${heading}</strong> <span class="review-info"><button type="button" class="review-info-button" aria-label="Information om samlet karakter">i</button><span class="review-info-box" role="note"><strong>Her er vores anmeldelseskategorier</strong><br><br><strong>1. Legendarisk fra 12,50 – En oplevelse der løfter sig over det sædvanlige</strong><br>Bruges ekstremt sjældent.<br>Alt spiller: råvarer, håndværk, stemning, timing, nerve.<br>Noget man taler om længe efter.<br><br><strong>2. Sublimt - tæt på det exceptionelle 11,50–12,49</strong><br>Meget højt niveau hele vejen igennem.<br>Ambitiøst, sikkert og med personlighed.<br><br><strong>3. Forrygende - Går glad derfra og anbefaler det videre 10,00 – 11,49</strong><br>Solid kvalitet med flere øjeblikke, der skiller sig ud.<br><br><strong>4. Overbevisende – Rigtig godt 9,00 – 9,99</strong><br>Velsmagende, gennemført og kompetent.<br>Ikke nødvendigvis mind‑blowing, men tydeligt veludført.<br><br><strong>5. Uforløst - Ambitionen er der men helheden mangler &gt;9</strong><br>Der er gode takter, men også plads til forbedring.<br>Potentiale mere end forløsning.</span></span></span>`
        )
        .replace(/(^|\n)(Spis her hvis:)/g, "$1<strong class=\"review-heading\">$2</strong>")
        .replace(/\b(Besøgt:)(?=\s)/g, "<strong class=\"review-heading\">$1</strong>")
        .replace(/\b(Logenote:)/g, "<strong class=\"review-heading\">$1</strong>");

    const reelText =
        currentLanguage === "da"
        ? "🎥 Se Instagram Reel"
        : "🎥 Watch Instagram Reel";

    return `
        ${r.billede ? `
        <img
            src="${r.billede}"
            style="
                width:100%;
                max-height:${isPopup ? "160px" : "450px"};
                object-fit:cover;
                border-radius:12px;
                margin-bottom:${isPopup ? "10px" : "20px"};
            ">
        ` : ''}
        <p style="display:flex; align-items:baseline; gap:12px;">
            <span>📍</span>
            ${distance ? `<span style="white-space:nowrap;">${distance}</span>` : ''}
        </p>

        <p style="margin-top:-8px;">
            <strong>${addressLabel}</strong> ${r.adresse}
        </p>

        <p class="review-text" style="white-space: pre-line;">
            <strong>${reviewLabel}</strong><br>
            ${reviewHtml}
        </p>

        ${r.instagram ? `
        <p>
            <a href="${r.instagram}"
               target="_blank"
               rel="noopener noreferrer">
               ${reelText}
            </a>
        </p>
        ` : ''}
    `;
}

function bindRestaurantPopup(marker, r){

    let closePopupTimeout;
    let popupHovered = false;

    marker.bindPopup(`
        <div class="restaurant-map-popup" style="width:242px; color:white; background:#222; padding:12px; border-radius:8px;">
            <strong style="display:block; margin-bottom:8px;">${r.restaurant}</strong>
            <div class="info-card" style="padding:0 12px 12px; margin:0;">
                ${restaurantDetailsHtml(r, true)}
            </div>
        </div>
    `, {
        maxWidth: 340,
        maxHeight: 450,
        className: 'restaurant-info-popup'
    });

    marker.on('mouseover', function(){
        clearTimeout(closePopupTimeout);
        this.openPopup();
    });

    marker.on('mouseout', function(){
        closePopupTimeout = setTimeout(() => {
            if(!popupHovered){
                this.closePopup();
            }
        }, 150);
    });

    marker.on('popupopen', event => {
        const popupElement = event.popup.getElement();

        popupElement.onmouseenter = () => {
            popupHovered = true;
            clearTimeout(closePopupTimeout);
        };

        popupElement.onmouseleave = () => {
            popupHovered = false;
            marker.closePopup();
        };
    });

    marker.on('popupclose', () => {
        popupHovered = false;
    });
}

function showRestaurant(name){

    if(mapMode){

    zoomToRestaurant(name);
    return;

}

    if(currentPage.type !== "restaurant"){
        previousScrollY = window.scrollY;
        previousPage = {...currentPage};
    }

    currentPage = {

        type: "restaurant",
        value: name
    };

    const r =
        restaurants.find(x =>
            x.restaurant === name);


    document.getElementById('content').innerHTML = `

        <h1>${r.restaurant}</h1>

        <div class="info-card">

            ${restaurantDetailsHtml(r)}

<div style="
    display:flex;
    justify-content:flex-end;
    margin-top:25px;
">

    <button
        onclick="closeRestaurant()"
        style="
            background:#333;
            color:white;
            border:none;
            border-radius:8px;
            padding:10px 16px;
            cursor:pointer;
        ">

        ✕ Luk

    </button>

</div>

</div>
`;

}

function closeRestaurant(){

    if(!previousPage) return;

    if(previousPage.type === "country"){
        showCountry(previousPage.value);
    }

    if(previousPage.type === "city"){
        showCity(previousPage.value);
    }

    if(previousPage.type === "region"){
        showRegion(previousPage.value);
    }

    if(previousPage.type === "nearby"){
        showNearbyMap();
    }

    setTimeout(() => {

        window.scrollTo(
            0,
            previousScrollY
        );

    }, 50);

}



function showNearbyMap(){

    currentPage = {
        type: "nearby"
    };

    if(!userLat || !userLng){


    document.getElementById('content').innerHTML = `
        <h1>${t(
    "Se hvad der er i nærheden",
    "What's nearby"
)}</h1>

<p>${t(
    "Finder din placering...",
    "Finding your location..."
)}</p>

    `;

    return;
}
    
    let html = `
    <h1>${t(
        "Se hvad der er i nærheden",
        "What's nearby"
    )}</h1>

    <div id="map"

            style="
                width:100%;
                height:700px;
                border-radius:12px;
                overflow:hidden;
            ">
        </div>
    `;

    document.getElementById('content').innerHTML = html;

    const map = L.map('map').setView(
        [userLat, userLng],
        11
    );

    L.circleMarker(
        [userLat, userLng],
        {
            radius:10,
            fillColor:"#0080ff",
            color:"#ffffff",
            weight:2,
            fillOpacity:1
        }
    )
    .addTo(map)
    .bindPopup(
        t(
            "📍 Du er her",
            "📍 You are here"
        )
    );

   L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution:'© OpenStreetMap'
    }
).addTo(map);

    restaurants.forEach(r => {

        if(!r.gps) return;

        const coords =
            r.gps.split(',');

        const lat =
            parseFloat(coords[0]);

        const lng =
            parseFloat(coords[1]);

        bindRestaurantPopup(
            L.marker([lat,lng]).addTo(map),
            r
        );

    });

}
